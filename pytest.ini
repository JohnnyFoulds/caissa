[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# UI tests are slow (they launch the real app) and are opt-in.
# Run them explicitly: pytest tests/ui -v
# Run unit tests only:  pytest tests/unit -v
markers =
    ui: integration tests that require a running Caissa process
    unit: fast unit tests that run without Qt
    rpa: fast RPA engine unit tests (FakeDriver + FakeClock, no Qt)
    rpa_ui: RPA integration tests that require a running Caissa process
    rpa_cv: RPA CV/OCR tests that require opencv + tesseract and a real display

# Increase default timeout for UI tests (socket waits)
# D12: RPA run deadline is 90 000 ms; pytest timeout is 120 s — 30 s headroom ensures
# the runner can unwind and persist its journal before pytest kills the process.
timeout = 120
